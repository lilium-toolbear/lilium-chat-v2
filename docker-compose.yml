# Dev environment (podman). Spec: docs/specs/2026-08-19-lilium-chat-elixir-redesign.md
#
#   podman compose up -d postgres   # DB only
#   podman compose up               # DB + app (mix phx.server on :4000)
#   podman compose run --rm app mix test
#   podman compose down
#
# Named volumes lilium_hex / lilium_mix cache hex packages and mix
# archives so repeated container runs don't re-fetch.
#
# The host has no Elixir toolchain — everything Elixir runs in the
# elixir:1.20-otp-29 image (spec §2.1: Elixir 1.20 / OTP 29).
services:
  postgres:
    image: docker.io/library/postgres:18
    container_name: lilium_chat_pg
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: lilium_chat_dev
    ports:
      - "${DB_PORT:-5432}:5432"
    # Needed by the conformance read-path probe (spec §7.5 query-count bound).
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    # PG 18+ stores data under /var/lib/postgresql/<version> (pg_ctlcluster
    # layout) — mount the parent dir, not the old /data path.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d lilium_chat_dev"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Conformance S3 fixture (issue #27 batch B/C): minimal deterministic
  # S3 stand-in (conformance/fixtures/fake-s3.mjs) so presign/finalize/
  # sticker scenarios run self-contained. The old-Worker target (host-side
  # wrangler) reaches it at 127.0.0.1:8900; the app container reaches it
  # at http://fake-s3:8900 (see app S3_* env + conformance/.dev.vars).
  fake-s3:
    image: docker.io/library/node:22-alpine
    container_name: lilium_fake_s3
    working_dir: /app
    command: node /app/fake-s3.mjs
    volumes:
      - ./conformance/fixtures:/app:ro
    ports:
      - "127.0.0.1:8900:8900"

  app:
    image: docker.io/library/elixir:1.20-otp-29
    container_name: lilium_chat_app
    depends_on:
      postgres:
        condition: service_healthy
      fake-s3:
        condition: service_started
    # Note: MIX_ENV is intentionally NOT set — mix defaults to :dev for
    # `mix phx.server`, and `mix test` sets :test itself. Pinning MIX_ENV
    # here would leak into `mix test` and break the SQL Sandbox pool.
    environment:
      DB_HOSTNAME: postgres
      DB_PORT: "5432"
      # Default matches the conformance harness (old-repo test secret) so the
      # worker,elixir parity gate works out of the box; override via env.
      JWT_SECRET: "${JWT_SECRET:-test-jwt-secret-do-not-use-in-prod}"
      # Conformance S3 fixture (issue #27 batch B/C) — see fake-s3 service.
      # S3_ENDPOINT is generation-only here (presigned URL host + SigV4
      # canonical host) and must equal the worker target's S3_ENDPOINT so
      # both upload_urls carry the same host; HEAD goes to S3_PUBLIC_BASE,
      # which is the compose-network name resolvable from THIS container.
      S3_ENDPOINT: "http://127.0.0.1:8900"
      S3_PUBLIC_BASE: "http://fake-s3:8900"
      S3_BUCKET: "lilium-chat-attachments"
      S3_REGION: "us-east-1"
      S3_ACCESS_KEY_ID: "conformance-access-key"
      S3_SECRET_ACCESS_KEY: "conformance-secret-key"
    ports:
      - "4000:4000"
    volumes:
      - ./:/app
      - lilium_hex:/root/.hex
      - lilium_mix:/root/.mix
    working_dir: /app
    command: sh -c "mix deps.get && mix ecto.create --quiet && mix ecto.migrate --quiet && exec mix phx.server"

volumes:
  pgdata:
  lilium_hex:
  lilium_mix:
